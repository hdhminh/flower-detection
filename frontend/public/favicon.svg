<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="daisyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.25" flood-color="#0F172A"/>
    </filter>
    <radialGradient id="daisyCore" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <linearGradient id="daisyPetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <g filter="url(#daisyShadow)" transform="translate(50, 50)">
    <!-- 12 White Radiating Daisy Petals -->
    <path d="M -6 -16 C -8.5 -32 -6 -47 0 -47 C 6 -47 8.5 -32 6 -16 Z" fill="url(#daisyPetal)" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(0)" />
    <path d="M -6 -16 C -8.5 -32 -6 -47 0 -47 C 6 -47 8.5 -32 6 -16 Z" fill="url(#daisyPetal)" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(30)" />
    <path d="M -6 -16 C -8.5 -32 -6 -47 0 -47 C 6 -47 8.5 -32 6 -16 Z" fill="url(#daisyPetal)" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(60)" />
    <path d="M -6 -16 C -8.5 -32 -6 -47 0 -47 C 6 -47 8.5 -32 6 -16 Z" fill="url(#daisyPetal)" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(90)" />
    <path d="M -6 -16 C -8.5 -32 -6 -47 0 -47 C 6 -47 8.5 -32 6 -16 Z" fill="url(#daisyPetal)" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(120)" />
    <path d="M -6 -16 C -8.5 -32 -6 -47 0 -47 C 6 -47 8.5 -32 6 -16 Z" fill="url(#daisyPetal)" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(150)" />
    <path d="M -6 -16 C -8.5 -32 -6 -47 0 -47 C 6 -47 8.5 -32 6 -16 Z" fill="url(#daisyPetal)" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(180)" />
    <path d="M -6 -16 C -8.5 -32 -6 -47 0 -47 C 6 -47 8.5 -32 6 -16 Z" fill="url(#daisyPetal)" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(210)" />
    <path d="M -6 -16 C -8.5 -32 -6 -47 0 -47 C 6 -47 8.5 -32 6 -16 Z" fill="url(#daisyPetal)" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(240)" />
    <path d="M -6 -16 C -8.5 -32 -6 -47 0 -47 C 6 -47 8.5 -32 6 -16 Z" fill="url(#daisyPetal)" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(270)" />
    <path d="M -6 -16 C -8.5 -32 -6 -47 0 -47 C 6 -47 8.5 -32 6 -16 Z" fill="url(#daisyPetal)" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(300)" />
    <path d="M -6 -16 C -8.5 -32 -6 -47 0 -47 C 6 -47 8.5 -32 6 -16 Z" fill="url(#daisyPetal)" stroke="#E2E8F0" stroke-width="0.8" transform="rotate(330)" />

    <!-- Golden Yellow Daisy Core (No stem, no leaf) -->
    <circle cx="0" cy="0" r="17.5" fill="url(#daisyCore)" stroke="#B45309" stroke-width="1.2" />
    <circle cx="0" cy="0" r="11" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="2.5 3" opacity="0.65" />
    <circle cx="-3" cy="-3" r="5" fill="#FEF08A" opacity="0.4" />
  </g>
</svg>